<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="atmosphere" cx=".38" cy=".28" r=".78">
      <stop stop-color="#69f7de" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#69f7de" stop-opacity=".025"/>
      <stop offset=".85" stop-color="#9e83ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#9e83ff" stop-opacity=".2"/>
    </radialGradient>
    <radialGradient id="core-halo">
      <stop stop-color="#d0fff5" stop-opacity=".3"/>
      <stop offset=".28" stop-color="#69f7de" stop-opacity=".13"/>
      <stop offset="1" stop-color="#69f7de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sphere-rim" x1="193" y1="181" x2="442" y2="463" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69f7de" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#69f7de" stop-opacity=".08"/>
      <stop offset=".72" stop-color="#9e83ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9e83ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="mesh" x1="189" y1="199" x2="458" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69f7de" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#8ddcf2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9e83ff" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="orbit" x1="68" y1="320" x2="572" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69f7de" stop-opacity=".08"/>
      <stop offset=".22" stop-color="#69f7de"/>
      <stop offset=".53" stop-color="#d6fff7"/>
      <stop offset=".79" stop-color="#9e83ff"/>
      <stop offset="1" stop-color="#9e83ff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="inner-orbit" x1="235" y1="320" x2="405" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69f7de" stop-opacity=".2"/>
      <stop offset=".48" stop-color="#e7fffa"/>
      <stop offset="1" stop-color="#9e83ff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft-light" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="point-light" x="-250%" y="-250%" width="600%" height="600%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="sphere-clip"><circle cx="320" cy="320" r="172"/></clipPath>
  </defs>

  <!-- A faint instrument plane frames the orbital sculpture. -->
  <g stroke="#a9b4d1" stroke-opacity=".14" stroke-width=".8">
    <circle cx="320" cy="320" r="247" stroke-dasharray="1 13"/>
    <path d="M320 62v22M320 556v22M62 320h22M556 320h22"/>
    <path d="M136 131l10 10M494 499l10 10M131 504l10-10M499 146l10-10"/>
  </g>

  <!-- Back arcs stay quiet so the crossing front arcs establish depth. -->
  <ellipse cx="320" cy="320" rx="267" ry="91" transform="rotate(-34 320 320)" stroke="#69f7de" stroke-opacity=".2"/>
  <ellipse cx="320" cy="320" rx="233" ry="101" transform="rotate(54 320 320)" stroke="#9e83ff" stroke-opacity=".22"/>
  <ellipse cx="320" cy="320" rx="204" ry="72" transform="rotate(-8 320 320)" stroke="#8ba6da" stroke-opacity=".15" stroke-dasharray="2 7"/>

  <circle cx="320" cy="320" r="172" fill="url(#atmosphere)" stroke="url(#sphere-rim)" stroke-width="1.2"/>
  <g clip-path="url(#sphere-clip)" stroke="url(#mesh)" stroke-width=".85" transform="rotate(-19 320 320)">
    <ellipse cx="320" cy="320" rx="35" ry="172"/>
    <ellipse cx="320" cy="320" rx="83" ry="172"/>
    <ellipse cx="320" cy="320" rx="128" ry="172"/>
    <ellipse cx="320" cy="320" rx="160" ry="172"/>
    <path d="M320 148v344"/>
    <ellipse cx="320" cy="176" rx="94" ry="29"/>
    <ellipse cx="320" cy="218" rx="145" ry="43"/>
    <ellipse cx="320" cy="267" rx="166" ry="50"/>
    <ellipse cx="320" cy="320" rx="172" ry="54"/>
    <ellipse cx="320" cy="373" rx="166" ry="50"/>
    <ellipse cx="320" cy="422" rx="145" ry="43"/>
    <ellipse cx="320" cy="464" rx="94" ry="29"/>
  </g>

  <!-- The luminous nucleus is made of editable vector rings. -->
  <circle cx="320" cy="320" r="108" fill="url(#core-halo)"/>
  <g transform="rotate(-34 320 320)">
    <ellipse cx="320" cy="320" rx="79" ry="29" stroke="#69f7de" stroke-opacity=".5" stroke-width="4" filter="url(#soft-light)"/>
    <ellipse cx="320" cy="320" rx="79" ry="29" stroke="url(#inner-orbit)" stroke-width="1.8"/>
    <ellipse cx="320" cy="320" rx="65" ry="23" stroke="#a9fff0" stroke-opacity=".28" stroke-width=".8"/>
    <path d="M241 320a79 29 0 0 0 158 0" stroke="#d1fff5" stroke-width="2.5"/>
  </g>
  <circle cx="320" cy="320" r="9" fill="#69f7de" fill-opacity=".65" filter="url(#point-light)"/>
  <circle cx="320" cy="320" r="3" fill="#e1fff8"/>
  <path d="M320 302v9M320 329v9M302 320h9M329 320h9" stroke="#b9fff1" stroke-opacity=".6"/>

  <!-- Sweeping foreground orbits give the globe a strong diagonal silhouette. -->
  <g transform="rotate(-34 320 320)">
    <path d="M53 320a267 91 0 0 0 534 0" stroke="url(#orbit)" stroke-opacity=".25" stroke-width="5" filter="url(#soft-light)"/>
    <path d="M53 320a267 91 0 0 0 534 0" stroke="url(#orbit)" stroke-width="1.8"/>
    <path d="M89 365c23 18 56 31 95 39" stroke="#a8fff0" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="159" cy="393" r="4" fill="#bcfff1"/>
    <circle cx="159" cy="393" r="7" fill="#69f7de" fill-opacity=".8" filter="url(#point-light)"/>
    <circle cx="527" cy="377" r="2.2" fill="#bba4ff"/>
  </g>
  <g transform="rotate(54 320 320)">
    <path d="M87 320a233 101 0 0 0 466 0" stroke="#9e83ff" stroke-opacity=".74" stroke-width="1.1"/>
    <path d="M424 410c49-11 86-29 107-51" stroke="#c0acff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="467" cy="398" r="3.2" fill="#c8b8ff"/>
    <circle cx="467" cy="398" r="7" fill="#9e83ff" fill-opacity=".6" filter="url(#point-light)"/>
  </g>

  <!-- Small points suggest an active field without competing with the sculpture. -->
  <g fill="#69f7de">
    <circle cx="219" cy="180" r="2.6"/>
    <circle cx="467" cy="259" r="1.7"/>
    <circle cx="163" cy="368" r="1.6"/>
    <circle cx="110" cy="209" r="1.4" fill-opacity=".55"/>
    <circle cx="538" cy="194" r="1.6" fill-opacity=".75"/>
  </g>
  <g fill="#c0adff">
    <circle cx="397" cy="465" r="2.4"/>
    <circle cx="494" cy="473" r="1.4" fill-opacity=".75"/>
    <circle cx="265" cy="532" r="1.2" fill-opacity=".55"/>
  </g>
  <g stroke="#8ad5d6" stroke-opacity=".34" stroke-width=".8">
    <path d="M110 170v10M105 175h10M522 431v10M517 436h10"/>
    <circle cx="219" cy="180" r="7"/>
    <circle cx="397" cy="465" r="7"/>
  </g>
</svg>
